# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "93f19ebe1ec0cb32788dc8a11ef5035a"
application_url = "https://shopify-qa.eboxsecure.com"
embedded = true
name = "eboxsecure-dev"
handle = "eboxsecure-dev"

[build]
dev_store_url = "eboxsecure-dev-store.myshopify.com"
include_config_on_deploy = true
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2025-01"

  # Lifecycle webhooks that drive Order creation/updates. orders/create carries
  # the ebox.eboxOrder metafield used for deterministic linking.
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/api/webhooks"
  metafield_namespaces = [ "ebox" ]

  [[webhooks.subscriptions]]
  topics = [ "orders/cancelled", "fulfillments/create", "fulfillments/update" ]
  uri = "/api/webhooks"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/api/webhooks"

  # Mandatory GDPR compliance webhooks (ADR 0003).
  [webhooks.privacy_compliance]
  customer_data_request_url = "/api/webhooks"
  customer_deletion_url = "/api/webhooks"
  shop_deletion_url = "/api/webhooks"


[access_scopes]
scopes = "read_orders,read_customers,read_fulfillments"
# Managed installation: Shopify grants scopes at install; the app obtains an
# offline token via App Bridge token exchange (no OAuth redirect/callback).
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://shopify-qa.eboxsecure.com/api/auth/callback"
]

[pos]
embedded = false
